<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/bmi.css">
    <script src="https://kit.fontawesome.com/36a7b8a438.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
            extend: {
                colors: {
                primaryBlue: '#1083ea',
                activeRed: '#e74c3c',
                healthyGreen: '#2ecc71',
                cardBg: '#ffffff',
                bodyBg: '#f8f9fa'
                },
                // Add this new animation block
                animation: {
                'fade-in-up': 'fadeInUp 0.4s ease-out forwards',
                },
                keyframes: {
                fadeInUp: {
                    '0%': { opacity: '0', transform: 'translateY(15px)' },
                    '100%': { opacity: '1', transform: 'translateY(0)' },
                }
                }
            }
            }
        }
    </script>
</head>
<body class="bg-bodyBg text-gray-800 font-sans antialiased min-h-screen flex flex-col">
<!-- Navigation Bar (Lightly refactored to flexbox & shadow) -->
<header class="bg-white shadow-sm flex items-center justify-between px-6 py-4 relative z-50">
    <!-- LEFT WING -->
    <div class="flex-1 flex justify-start">
        <button class="text-gray-600 hover:text-primaryBlue focus:outline-none md:hidden" id="hamburgerBtn" aria-label="Toggle Menu">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </div>

    <!-- CENTER: Navigation & Nav Skeletons -->
    <div class="flex justify-center items-center">

        <!-- Skeleton Loader (Toggled by JS while checking Auth) -->
        <div id="navSkeletonWrapper" class="hidden md:flex space-x-8">
            <div class="h-5 w-16 bg-gray-200 rounded animate-pulse"></div>
            <div class="h-5 w-20 bg-gray-200 rounded animate-pulse"></div>
            <div class="h-5 w-16 bg-gray-200 rounded animate-pulse"></div>
        </div>

        <!-- Actual Navigation -->
        <nav class="hidden md:flex justify-center space-x-8 font-medium" id="navMenu">
            <a href="/" class="hover:text-primaryBlue transition-colors">Home</a>
            <a href="/about" class="hover:text-primaryBlue transition-colors">About Us</a>

            <div id="toolDropdown" class="relative group cursor-pointer">
                    <span class="hover:text-primaryBlue transition-colors flex items-center gap-1">
                        Tools
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </span>
                <div class="absolute left-0 mt-2 w-48 bg-white border border-gray-100 rounded-md shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 flex flex-col overflow-hidden">
                    <!-- Example of the restored links in the Tools dropdown -->
                    <a href="/bmi-calculator" class="transition-link px-4 py-2 hover:bg-gray-50 hover:text-primaryBlue">BMI Calculator</a>
                    <a href="/bmr-calculator" class="transition-link px-4 py-2 hover:bg-gray-50 hover:text-primaryBlue">BMR Calculator</a>
                    <a href="/tdee-calculator" class="transition-link px-4 py-2 hover:bg-gray-50 hover:text-primaryBlue">TDEE Calculator</a>
                </div>
            </div>
        </nav>
    </div>

    <!-- RIGHT WING: Auth, Profile Skeletons, Dropdowns -->
    <div class="flex-1 flex justify-end items-center space-x-4">

        <!-- Auth Links (Shown if NOT logged in) -->
        <div id="authLinksLi" class="flex items-center space-x-4">
            <a href="/login" id="loginBtn" class="text-gray-600 hover:text-primaryBlue font-medium">Login</a>
            <a href="/register" id="registerBtn" class="bg-primaryBlue hover:bg-blue-600 text-white px-4 py-2 rounded-md font-medium transition-colors shadow-sm">Register</a>
        </div>

        <!-- Profile Skeleton Loader -->
        <div id="profileSkeletonWrapper" class="hidden">
            <div class="h-8 w-8 bg-gray-200 rounded-full animate-pulse"></div>
        </div>

        <!-- User Profile Dropdown (Shown if LOGGED IN) -->
        <div id="profileDropdown" class="relative group cursor-pointer hidden">
            <a href="#" id="userProfileLink" class="text-gray-600 hover:text-primaryBlue">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 448 512"><path d="M224 248a120 120 0 1 0 0-240 120 120 0 1 0 0 240zm-29.7 56C95.8 304 16 383.8 16 482.3 16 498.7 29.3 512 45.7 512l356.6 0c16.4 0 29.7-13.3 29.7-29.7 0-98.5-79.8-178.3-178.3-178.3l-59.4 0z"></path></svg>
            </a>

            <ul id="profileDropdownMenu" class="absolute right-0 mt-2 w-56 bg-white border border-gray-100 rounded-md shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 flex flex-col py-2 z-50">
                <div class="px-4 py-3 border-b border-gray-100 flex items-center space-x-3">
                    <svg class="w-8 h-8 text-gray-400" fill="currentColor" viewBox="0 0 448 512"><path d="M224 248a120 120 0 1 0 0-240 120 120 0 1 0 0 240zm-29.7 56C95.8 304 16 383.8 16 482.3 16 498.7 29.3 512 45.7 512l356.6 0c16.4 0 29.7-13.3 29.7-29.7 0-98.5-79.8-178.3-178.3-178.3l-59.4 0z"></path></svg>
                    <span class="font-bold text-gray-800 truncate" id="profileName">Username</span>
                </div>
                <li><a href="/profile" class="flex justify-between items-center px-4 py-2 hover:bg-gray-50 hover:text-primaryBlue text-sm">
                    <span class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                       <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                    Profile
                    </span>
                </a></li>
                <li><a href="/settings" class="flex justify-between items-center px-4 py-2 hover:bg-gray-50 hover:text-primaryBlue text-sm">
                    <span class="flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                        Settings
                    </span> 
                    <span class="text-gray-400 text-xs">❯</span>
                    </a>
                </li>
                <li><a href="#" class="flex justify-between items-center px-4 py-2 hover:bg-gray-50 hover:text-primaryBlue text-sm">
                    <span id="signOutLink" class="flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15" />
                        </svg>
                        Sign Out
                    </span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>

<!-- Full Screen Loader Overlay -->
<div id="loader" class="hidden fixed inset-0 bg-white/75 backdrop-blur-sm z-[100] flex justify-center items-center">
    <!-- A smooth spinning ring loader using border styles -->
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-gray-200 border-t-primaryBlue"></div>
</div>

<!-- Main BMI Calculator Section -->
<!-- Apply this to the main tag on home.html, login.html, etc. -->
<main class="animate-fade-in-up flex-grow flex justify-center items-center px-4 py-12">
    <!-- Replaced inline flex and widths with Tailwind max-w and shadow-lg -->
    <div class="bg-white shadow-xl rounded-2xl max-w-md w-full p-8">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-800">BMI Calculator</h2>
            <p class="text-gray-500 text-sm mt-1">Check your body mass index</p>
        </div>

        <!-- Toggle Buttons -->
        <div class="flex justify-center mb-8 rounded-lg overflow-hidden border border-gray-200">
            <!-- Active State -->
            <button type="button" id="standard-btn" class="flex-1 py-2 font-bold bg-healthyGreen text-white transition-colors">Standard</button>
            <!-- Inactive State -->
            <button type="button" id="metric-btn" class="flex-1 py-2 font-bold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors">Metric</button>
        </div>

        <form id="bmi-form" novalidate class="space-y-6">
            <!-- Height Input Group -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Height</label>
                <div id="standard-height-group" class="flex items-center space-x-3">
                    <div class="relative flex-1">
                        <input type="number" id="feet" inputmode="numeric" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-primaryBlue focus:border-primaryBlue outline-none transition-all">
                        <span class="absolute right-3 top-2.5 text-gray-400 text-sm">ft</span>
                    </div>
                    <div class="relative flex-1">
                        <input type="number" id="inches" inputmode="numeric" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-primaryBlue focus:border-primaryBlue outline-none transition-all">
                        <span class="absolute right-3 top-2.5 text-gray-400 text-sm">in</span>
                    </div>
                </div>

                <div id="metric-height-group" class="hidden relative">
                    <input type="number" id="cm" inputmode="numeric" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-primaryBlue focus:border-primaryBlue outline-none transition-all">
                    <span class="absolute right-3 top-2.5 text-gray-400 text-sm">cm</span>
                </div>
            </div>

            <!-- Weight Input Group -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Weight</label>
                <div id="standard-weight-group" class="relative">
                    <input type="number" id="lbs" inputmode="decimal" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-primaryBlue focus:border-primaryBlue outline-none transition-all">
                    <span class="absolute right-3 top-2.5 text-gray-400 text-sm">lbs</span>
                </div>

                <div id="metric-weight-group" class="hidden relative">
                    <input type="number" id="kg" inputmode="decimal" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-primaryBlue focus:border-primaryBlue outline-none transition-all">
                    <span class="absolute right-3 top-2.5 text-gray-400 text-sm">kg</span>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="calculateBtn" class="w-full bg-primaryBlue hover:bg-blue-600 text-white font-bold py-3 rounded-lg shadow-md transition duration-200 transform hover:-translate-y-0.5">
                Calculate BMI
            </button>
        </form>

        <!-- Result Box -->
        <div class="mt-8 p-4 bg-gray-50 rounded-xl border-l-4 border-primaryBlue text-center shadow-sm">
            <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Your Body Mass Index</h4>
            <span id="resultMessage" class="text-2xl font-bold text-gray-800">BMI = 0.0</span>
        </div>

        <div class="mt-4 relative h-2 bg-gray-200 rounded-full overflow-hidden">
            <div id="bmiScaleFill" class="absolute top-0 left-0 h-full bg-healthyGreen w-0 transition-all duration-500"></div>
        </div>
    </div>
</main>
<script type="module" src="js/navbar.js"></script>
<script type="module" src="js/bmi-calculator.js"></script>
</body>
</html>
