<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/bmi.css">
</head>
<body>
      <header class="nav-container">
        <button class="hamburger" id="hamburgerBtn">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-menu" id="navMenu">
            <ul id="nav-list">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About Us</a></li>
                <li id="profile-item"><a href="/profile">User Profile</a></li>
                <li id="toolDropdown" class="dropdown-parent">
                    <a href="#">Tools</a>
                    <ul id="toolDropdownMenu">
                        <li><a href="/bmi-calculator">BMI Calculator</a></li>
                        <li><a href="/bmr-calculator">BMR Calculator</a></li>
                        <li><a href="/tdee-calculator">TDEE Calculator</a></li>
                    </ul>
                </li>
                <li id="authLinksLi">
                    <div id="nav-right">
                        <div id="loginBtn">
                            <a href="/login">Login</a>
                        </div>
                        <div id="registerBtn">
                            <a href="/register">Signup</a>
                        </div>
                    </div>
                </li>
            </ul>
        </nav>
      </header>
    
    <main class="bmi-container" style = "display: flex; justify-content: center; margin-top: 40px; padding: 0 20px">
      <div class="bmi-card" style="max-width: 480px; width: 100%;">
        <div class="card-header" style="text-align: center; margin-bottom: 20px;">
            <h2 style="margin: 0; color: #2c3e50;">BMI Calculator</h2>
        </div>

        <div class = "bmi-content">
          <div class="form-group" style="justify-content: center; margin-bottom: 24px;">
              <button type="button" id="standard-btn" class="btn-toggle active" style="padding: 10px 20px; border: none; border-radius: 6px 0 0 6px; cursor: pointer; font-weight: bold; background-color: #2ecc71; color: white;">Standard</button>
              <button type="button" id="metric-btn" class="btn-toggle" style="padding: 10px 20px; border: none; border-radius: 0 6px 6px 0; cursor: pointer; font-weight: bold; background-color: #dee2e6; color: #495057;">Metric</button>
          </div>

          <form id="bmi-form" novalidate>
            <div class="form-group">
              <label>Height</label>
              <div id="standard-height-group" class="input-inline-group">
                  <input type="number" id="feet" inputmode="numeric">
                  <span class="unit-label">Feet</span>

                  <input type="number" id="inches" inputmode="numeric">
                  <span class="unit-label">Inches</span>
              </div>

              <div id="metric-height-group" class="input-inline-group hidden">
                  <input type="number" id="cm" inputmode="numeric">
                  <span class="unit-label">Cm</span>
              </div>
          </div>

          <div class="form-group">
              <label>Weight</label>
              <div id="standard-weight-group" class="input-inline-group">
                  <input type="number" id="lbs" inputmode="decimal">
                  <span class="unit-label">Pounds</span>
              </div>

              <div id="metric-weight-group" class="input-inline-group hidden">
                  <input type="number" id="kg" inputmode="decimal">
                  <span class="unit-label">Kilograms</span>
              </div>
            </div>
            <button type="submit" id="submit" class="btn-primary-food" style="background-color: #1083ea; margin-top: 10px;">Calculate BMR</button>
          </form>

          <div class="bmi-result" style="margin-top: 24px; padding: 16px; background-color: #f8f9fa; border-radius: 8px; border-left: 4px solid #1083ea; text-align: center;">
            <h4 style="margin: 0 0 6px 0; color: #6c757d; font-size: 0.9rem; text-transform: uppercase;">Your Body Mass Index</h4>
            <span id="resultMessage" style="font-size: 1.4rem; font-weight: bold; color: #2c3e50;">BMI = 0.0 kcal/day</span>
          </div>

          <div class="bmi-scale-container">
              <div class="bmi-scale-track">
                  <div class="bmi-scale-fill" id="bmiScaleFill">
                  <div class="bmi-scale-pointer">➔</div>
              </div>
          </div>
      </div>
  </main>
  <script type="module" src = "js/navbar.js"></script>
  <script type="module" src = "js/bmi-calculator.js"></script>
</body>
</html>
