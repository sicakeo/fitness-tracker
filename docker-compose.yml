version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: fitness_db
    restart: always
    environment:
      MYSQL_DATABASE: fitness_tracker
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: fitness_user
      MYSQL_PASSWORD: fitness_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    # This healthcheck pings MySQL until it is fully initialized
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  app:
    build: .
    container_name: fitness_app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        # This forces the app to wait for the healthcheck to pass before booting
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/fitness_tracker?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: fitness_user
      SPRING_DATASOURCE_PASSWORD: fitness_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET_KEY}
      API_NINJA_KEY: ${API_NINJA_API_KEY}
      USDA_API_KEY: ${USDA_API_KEY}

volumes:
  db_data: