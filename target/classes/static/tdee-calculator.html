<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TDEE Calculator</title>

    <script src="https://kit.fontawesome.com/36a7b8a438.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="nav-container">
        <button class="hamburger" id="hamburgerBtn" aria-label="Toggle Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="nav-spacer"></div>

        <div class="nav-skeleton-wrapper" id ="navSkeletonWrapper">
            <div class="nav-skeleton"></div>
            <div class="nav-skeleton"></div>
            <div class="nav-skeleton"></div>
        </div>

        <nav class="nav-menu" id="navMenu">     
            <ul class="nav-list" id="navList">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About Us</a></li>
                <li id="toolDropdown" class="dropdown-parent">
                    <a href="#">Tools</a>
                    <ul id="toolDropdownMenu">
                        <li><a href="/bmi-calculator">BMI Calculator</a></li>
                        <li><a href="/bmr-calculator">BMR Calculator</a></li>
                        <li><a href="/tdee-calculator">TDEE Calculator</a></li>
                    </ul>
                </li>

                <li id="authLinksLi">
                    <div class="nav-right">
                        <a href="/login" id="loginBtn">Login</a>
                        <a href="/register" id="registerBtn">Register</a>
                    </div>
                </li>
            </ul>
        </nav>

        <div id="profileDropdown" class="dropdown-parent">
            <a href="#" id="userProfileLink" class="user-profile-link">
                <svg class="svg-inline--fa fa-user" alt="User Profile" data-prefix="fas" data-icon="user" role="img" viewBox="0 0 448 512" aria-hidden="true" data-fa-i2svg=""><path fill="currentColor" d="M224 248a120 120 0 1 0 0-240 120 120 0 1 0 0 240zm-29.7 56C95.8 304 16 383.8 16 482.3 16 498.7 29.3 512 45.7 512l356.6 0c16.4 0 29.7-13.3 29.7-29.7 0-98.5-79.8-178.3-178.3-178.3l-59.4 0z"></path></svg><!-- <i class="fa-solid fa-user" alt="User Profile"></i> Font Awesome fontawesome.com -->
            </a>
            <ul id="profileDropdownMenu" class="profile-card-dropdown" hidden>
                <!-- User Profile Header -->
                <div class="dropdown-user-header">
                    <svg src="images/user-icon.png" class="svg-inline--fa fa-user" data-prefix="fas" data-icon="user" role="img" viewBox="0 0 448 512" aria-hidden="true" data-fa-i2svg=""><path fill="currentColor" d="M224 248a120 120 0 1 0 0-240 120 120 0 1 0 0 240zm-29.7 56C95.8 304 16 383.8 16 482.3 16 498.7 29.3 512 45.7 512l356.6 0c16.4 0 29.7-13.3 29.7-29.7 0-98.5-79.8-178.3-178.3-178.3l-59.4 0z"></path></svg><!-- <img src="images/user-icon.png" class="fa-solid fa-user"> Font Awesome fontawesome.com -->
                    <span class="user-name-text">Username</span>
                </div>
                
                <hr class="dropdown-divider">
                
                <a href="/profile" class="view-all-btn">Profile</a>

                <!-- Menu Links List -->
                <li>
                    <a href="/settings" class="menu-item">
                        <div class="menu-left">
                            <div class="icon-circle">⚙️</div>
                            <span>Setting</span>
                        </div>
                        <div class="menu-right">❯</div>
                    </a>
                </li>
               
                <li>
                    <span id="signOutLink" class="menu-item logout-row">
                        <div class="menu-left">
                            <div class="icon-circle">🚪</div>
                            <span>Logout</span>
                        </div>
                    </span>
                </li>
            </ul>
        </div>
    </header>

  <main class="tdee-container" style="display: flex; justify-content: center; margin-top: 40px; padding: 0 20px;">
        <div class="tdee-card" style="max-width: 480px; width: 100%;">
            <div class="card-header" style="text-align: center; margin-bottom: 20px;">
                <h2 style="margin: 0; color: #2c3e50;">TDEE Calculator</h2>
            </div>

            <div class = "tdee-content">
                <div class="form-row-group" style="justify-content: center; margin-bottom: 24px;">
                    <button type="button" id="standard-btn" class="btn-toggle active" style="padding: 10px 20px; border: none; border-radius: 6px 0 0 6px; cursor: pointer; font-weight: bold; background-color: #2ecc71; color: white;">Standard</button>
                    <button type="button" id="metric-btn" class="btn-toggle" style="padding: 10px 20px; border: none; border-radius: 0 6px 6px 0; cursor: pointer; font-weight: bold; background-color: #dee2e6; color: #495057;">Metric</button>
                </div>

                <form id="tdee-form" novalidate>
                    <div class="form-row-layout" id = "gender-group">
                        <label for="gender">Gender</label>
                        <select id="gender" required>
                            <option value="" disabled selected>Select your gender</option>
                            <option value="M">Male</option>              
                            <option value="F">Female</option>
                        </select>
                    </div>

                    <div class="form-row-layout">
                        <label for="age">Age</label>
                        <div class="input-inline-group">
                            <input type="number" id="age" inputmode="numeric" required>
                            <span class="unit-label">Years</span>
                        </div>
                     </div>

                    <div class="form-row-layout">
                        <label>Height</label>
                        <div id="standard-height-group" class="input-inline-group">
                            <input type="number" id="feet" inputmode="numeric">
                            <span class="unit-label">Feet</span>

                            <input type="number" id="inches" inputmode="numeric">
                            <span class="unit-label">Inches</span>
                        </div>

                        <div id="metric-height-group" class="input-inline-group hidden">
                            <input type="number" id="cm" inputmode="numeric">
                            <span class="unit-label">Cm</span>
                        </div>
                    </div>

                    <div class="form-row-layout">
                        <label>Weight</label>
                        <div id="standard-weight-group" class="input-inline-group">
                            <input type="number" id="lbs" inputmode="decimal">
                            <span class="unit-label">Pounds</span>
                        </div>

                        <div id="metric-weight-group" class="input-inline-group hidden">
                            <input type="number" id="kg" inputmode="decimal">
                            <span class="unit-label">Kilograms</span>
                        </div>
                    </div>

                    <div class="form-row-layout">
                        <label for="activityLevel">Activity Level:</label>
                        <select id="activityLevel">
                            <option value="" disabled selected>Select your activity level</option>
                            <option value="1.2">Sedentary (little or no exercise)</option>
                            <option value="1.375">Lightly active (light exercise/sports 1-3 days/week)</option>
                            <option value="1.55">Moderately active (moderate exercise/sports 3-5 days/week)</option>
                            <option value="1.725">Active (hard exercise/sports 6-7 days a week)</option>
                            <option value="1.9">Very active (very hard exercise/sports & physical job or 2x training)</option>
                        </select>
                    </div>
                    <button type="submit" id="calculateBtn" class="calculate-btn">Calculate TDEE</button>
                </form>

                <div class="tdee-result">
                    <h4>Total Daily Energy Expenditure </h4>
                    <span id="resultMessage" style="font-size: 1.4rem; font-weight: bold; color: #2c3e50;">TDEE = 0.0 kcal/day</span>
                </div>
            </div>
        </div>
  </main>
  <script type="module" src = "js/navbar.js"></script>
  <script type="module" src = "js/tdee-calculator.js"></script>
</body>
</html>
