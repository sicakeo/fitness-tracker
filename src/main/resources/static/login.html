<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
    
    <body>
    <header class="nav-container">
        <button class="hamburger" id="hamburgerBtn">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-menu" id="navMenu">
            <ul id="nav-list">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About Us</a></li>
                <li id="toolDropdown" class="dropdown-parent">
                    <a href="#">Tools</a>
                    <ul id="toolDropdownMenu">
                        <li><a href="/bmi-calculator">BMI Calculator</a></li>
                        <li><a href="/bmr-calculator">BMR Calculator</a></li>
                        <li><a href="/tdee-calculator">TDEE Calculator</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <main class = "login-container" style = "display: flex; justify-content: center; margin-top: 40px; padding: 0 20px">
        <div class="login-card" style="max-width: 400px; width: 100%;">
            <div class="card-header" style="text-align: center; margin-bottom: 20px;">
                <h2 style="margin: 0; color: #2c3e50;">Login</h2>
            </div>
            
            <form id = "loginForm" novalidate>
                <div class = "form-group">
                    <label for = "username">Username</label>
                    <input type = "text" name = "username" id = "username" placeholder = "username" required>
                </div>

                <div class = "form-group">
                    <label for = "password">Password</label>
                    <input type = "password" name = "password" id = "password" placeholder = "password" required>
                </div>

                <div class = "form-group">
                    <button type = "submit" id = "loginButton">Login</button>
                </div>
                <p>New User? Register <a href="/register" style = "color: #007bff">here</a></p>
            </form>
        </div>
    </main>
    <script type="module" src = "js/navbar.js"></script>
    <script type ="module" src="js/login.js"></script>
</body>
</html>
